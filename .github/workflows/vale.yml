name: Vale

on:
  push:
    paths:
      - "**.md"
      - "**.mdx"
      - ".vale.ini"
      - ".vale/**"

jobs:
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vale-cli/vale-action@v3
        with:
          version: 3.9.1
          files: docs
          fail_on_error: true
          reporter: github-pr-review